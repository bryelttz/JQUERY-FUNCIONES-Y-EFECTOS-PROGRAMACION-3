<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Evento dblclick</title>
<body>
  <h1>dblclick</h1>
  <p>Se activa cuando haces doble clic.</p>
  <button id="objetivo">Haz doble clic</button>
  <p id="resultado">Aun no hubo doble clic.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").on("dblclick", function () { $("#resultado").text("¡Detecte el doble clic!"); });
  </script>
</body>
</html>
