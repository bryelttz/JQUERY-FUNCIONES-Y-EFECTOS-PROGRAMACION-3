<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Evento blur</title>
<body>
  <h1>blur</h1>
  <p>Se activa cuando el campo deja de estar seleccionado. Primero haz clic dentro y luego fuera.</p>
  <input id="objetivo" placeholder="Haz clic aqui y luego fuera">
  <p id="resultado">El campo todavia no perdio el foco.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").on("blur", function () { $("#resultado").text("El campo perdio el foco."); });
  </script>
</body>
</html>
