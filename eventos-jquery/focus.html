<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Evento focus</title>
<body>
  <h1>focus</h1>
  <p>Se activa cuando el campo queda seleccionado y listo para escribir.</p>
  <input id="objetivo" placeholder="Haz clic aqui">
  <p id="resultado">El campo no tiene el foco.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").on("focus", function () { $("#resultado").text("El campo tiene el foco."); });
  </script>
</body>
</html>
