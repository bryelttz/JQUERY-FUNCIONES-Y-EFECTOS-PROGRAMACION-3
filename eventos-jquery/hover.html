<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Metodo hover de jQuery</title>
<body>
  <h1>hover</h1>
  <p><code>hover()</code> es un metodo de jQuery que recibe una funcion al entrar y otra al salir.</p>
  <div id="objetivo" style="padding: 40px; width: 220px; background: lightblue;">Pasa el puntero por aqui</div>
  <p id="resultado">Mueve el puntero sobre el recuadro.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").hover(function () { $("#resultado").text("Entraste"); }, function () { $("#resultado").text("Saliste"); });
  </script>
</body>
</html>
