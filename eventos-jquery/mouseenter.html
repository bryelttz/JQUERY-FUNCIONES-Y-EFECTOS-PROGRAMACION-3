<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Evento mouseenter</title>
<body>
  <h1>mouseenter</h1>
  <p>Se activa cuando el puntero entra en el elemento.</p>
  <div id="objetivo" style="padding: 40px; width: 220px; background: lightblue;">Pasa el puntero por aqui</div>
  <p id="resultado">Aun no entro el puntero.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").on("mouseenter", function () { $("#resultado").text("¡El puntero entro!"); });
  </script>
</body>
</html>
