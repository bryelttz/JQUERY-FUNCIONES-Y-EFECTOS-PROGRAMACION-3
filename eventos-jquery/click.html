<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Evento click</title>
<body>
  <h1>click</h1>
  <p>Se activa cuando haces clic una vez.</p>
  <button id="objetivo">Haz clic</button>
  <p id="resultado">Aun no hubo clic.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Descomenta la linea siguiente para probar:
    $("#objetivo").on("click", function () { $("#resultado").text("¡Detecte el clic!"); });
  </script>
</body>
</html>
