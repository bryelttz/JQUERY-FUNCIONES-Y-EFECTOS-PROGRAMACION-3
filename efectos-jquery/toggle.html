<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Efecto toggle</title>
<body>
  <h1>toggle()</h1>
  <p>Alterna entre ocultar y mostrar. Cada clic cambia al estado contrario.</p>
  <button id="accion">Alternar</button>
  <p id="objetivo" style="padding: 20px; background: lightblue;">Haz clic para ocultarme o mostrarme.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $("#accion").on("click", function () {
      $("#objetivo").toggle(600);
    });
  </script>
</body>
</html>
